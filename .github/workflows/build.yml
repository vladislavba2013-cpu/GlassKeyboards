name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean sources
        run: |
          if [ -f "GlassKeyboard.zip" ]; then
            unzip -q GlassKeyboard.zip
            cp -rn GlassKeyboard/* . || true
          fi
          rm -f app/src/main/java/com/glasskb/themes.kt app/src/main/java/com/glasskb/MainActivity.txt

          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          sed -i 's/eme_name/ime_name/g' app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/xml/method.xml

          python3 -c '
          import glob
          for f in glob.glob("app/src/main/java/com/glasskb/*.kt"):
              s = open(f, "rb").read().decode("utf-8", errors="ignore").lstrip("\ufeff \t\r\n")
              if not s.startswith("package "):
                  idx = s.find("package ")
                  if idx != -1:
                      s = s[idx:]
              open(f, "w", encoding="utf-8").write(s + "\n")
          kb = open("app/src/main/java/com/glasskb/KbController.kt", encoding="utf-8").read()
          cut = kb.find("private fun startVoiceInternal")
          if cut != -1:
              open("app/src/main/java/com/glasskb/KbController.kt", "w", encoding="utf-8").write(kb[:cut].rstrip() + "\n")
          '
          printf '\n    private fun startVoiceInternal() {\n        if (!SpeechRecognizer.isRecognitionAvailable(service)) return\n        stopVoice()\n        val sr = SpeechRecognizer.createSpeechRecognizer(service)\n        recognizer = sr\n        sr.setRecognitionListener(object : RecognitionListener {\n            override fun onReadyForSpeech(params: Bundle?) { listening = true }\n            override fun onBeginningOfSpeech() {}\n            override fun onRmsChanged(rmsdB: Float) {}\n            override fun onBufferReceived(buffer: ByteArray?) {}\n            override fun onEndOfSpeech() { listening = false }\n            override fun onError(error: Int) { listening = false }\n            override fun onPartialResults(partialResults: Bundle?) {}\n            override fun onEvent(eventType: Int, params: Bundle?) {}\n            override fun onResults(results: Bundle?) {\n                listening = false\n                val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()\n                if (!text.isNullOrBlank()) {\n                    ic()?.commitText("$text ", 1)\n                }\n            }\n        })\n        val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {\n            putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)\n            putExtra(RecognizerIntent.EXTRA_LANGUAGE, if (lang == "ru") "ru-RU" else "en-US")\n        }\n        listening = true\n        runCatching { sr.startListening(intent) }.onFailure { listening = false }\n    }\n\n    fun stopVoice() {\n        listening = false\n        runCatching {\n            recognizer?.stopListening()\n            recognizer?.destroy()\n        }\n        recognizer = null\n    }\n}\n' >> app/src/main/java/com/glasskb/KbController.kt
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
