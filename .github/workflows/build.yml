name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and repair XML
        run: |
          if [ -f "GlassKeyboard.zip" ]; then
            unzip -q GlassKeyboard.zip
            cp -rn GlassKeyboard/* . || true
          fi
          python3 -c '
          import glob, re
          c = chr(58)
          p = "android" + c
          s = open("app/src/main/AndroidManifest.xml", encoding="utf-8").read()
          s = re.sub(r"xmlns" + c + r"android=\"[^\"]+\"", "xmlns" + c + "android=\"http" + c + "//://android.com\"", s)
          attrs = ["name", "resource", "label", "icon", "theme", "exported", "permission", "authorities", "grantUriPermissions", "settingsActivity", "supportsSwitchingToNextInputMethod", "imeSubtypeLocale", "imeSubtypeMode", "allowBackup", "supportsRtl", "windowSoftInputMode", "excludeFromRecents", "taskAffinity"]
          for a in attrs:
              s = re.sub(r"(?<![a-zA-Z0-9_" + c + r"])" + a + "=", p + a + "=", s)
          open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8").write(s)
          for f in glob.glob("app/src/main/res/xml/*.xml"):
              x = open(f, encoding="utf-8").read()
              x = re.sub(r"xmlns" + c + r"android=\"[^\"]+\"", "xmlns" + c + "android=\"http" + c + "//://android.com\"", x)
              for a in attrs:
                  x = re.sub(r"(?<![a-zA-Z0-9_" + c + r"])" + a + "=", p + a + "=", x)
              open(f, "w", encoding="utf-8").write(x)
          '
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
