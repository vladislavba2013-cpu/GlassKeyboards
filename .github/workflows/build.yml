name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and fix XML namespaces
        run: |
          if [ -f "GlassKeyboard.zip" ]; then
            unzip -q GlassKeyboard.zip
            cp -rn GlassKeyboard/* . || true
          fi
          S="://android.com"
          sed -i "s|http://android.com|http://${S}/apk/res/android|g" app/src/main/AndroidManifest.xml app/src/main/res/xml/method.xml || true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
