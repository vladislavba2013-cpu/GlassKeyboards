name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and repair XML
        run: |
          if [ -f "GlassKeyboard.zip" ]; then
            unzip -q GlassKeyboard.zip
            cp -rn GlassKeyboard/* . || true
          fi
          python3 -c '
          import glob
          c = chr(58)
          bad = "http" + c + "//android.com"
          good = "http" + c + "//://android.com"
          for p in glob.glob("app/src/main/**/*.xml", recursive=True):
              s = open(p, encoding="utf-8").read()
              if bad in s:
                  open(p, "w", encoding="utf-8").write(s.replace(bad, good))
                  print("Fixed:", p)
          '
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
